name: Validate SR850 Native FIR Core
on:
  push:
    branches: [feature/sr850-system-audio]
    paths:
      - 'SystemAudio/ASIO/native/**'
      - '.github/workflows/test-native-fir.yml'
  workflow_dispatch:

jobs:
  native-fir:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - name: Build and test (Windows MSVC)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          cl /nologo /std:c++17 /EHsc /W4 /WX SystemAudio\ASIO\native\test_fir.cpp /Fe:fir_test.exe
          fir_test.exe
          cl /nologo /std:c++17 /EHsc /W4 /WX SystemAudio\ASIO\native\test_audio_buffers.cpp /Fe:buffers_test.exe
          buffers_test.exe
          cl /nologo /std:c++17 /EHsc /W4 /WX SystemAudio\ASIO\native\test_playback_pipeline.cpp /Fe:pipeline_test.exe
          pipeline_test.exe
          cl /nologo /std:c++17 /EHsc /W4 /WX SystemAudio\ASIO\native\test_duplex_engine.cpp /Fe:duplex_test.exe
          duplex_test.exe
          cl /nologo /std:c++17 /EHsc /W4 /WX SystemAudio\ASIO\native\test_sample_formats.cpp /Fe:formats_test.exe
          formats_test.exe
          cl /nologo /std:c++17 /EHsc /W4 /WX SystemAudio\ASIO\native\test_stream_negotiation.cpp /Fe:negotiation_test.exe
          negotiation_test.exe
          cl /nologo /std:c++17 /EHsc /W4 /WX SystemAudio\ASIO\native\test_device_session.cpp /Fe:session_test.exe
          session_test.exe
      - name: Build and test (Linux GCC)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -pedantic SystemAudio/ASIO/native/test_fir.cpp -o fir_test
          ./fir_test
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -pedantic SystemAudio/ASIO/native/test_audio_buffers.cpp -o buffers_test
          ./buffers_test
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -pedantic SystemAudio/ASIO/native/test_playback_pipeline.cpp -o pipeline_test
          ./pipeline_test
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -pedantic SystemAudio/ASIO/native/test_duplex_engine.cpp -o duplex_test
          ./duplex_test
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -pedantic SystemAudio/ASIO/native/test_sample_formats.cpp -o formats_test
          ./formats_test
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -pedantic SystemAudio/ASIO/native/test_stream_negotiation.cpp -o negotiation_test
          ./negotiation_test
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -pedantic SystemAudio/ASIO/native/test_device_session.cpp -o session_test
          ./session_test
