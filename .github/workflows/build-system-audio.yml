name: Build SR850 System Reference Windows EXE
on:
  push:
    branches: [feature/sr850-system-audio]
  workflow_dispatch:
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build dependencies
        run: python -m pip install numpy scipy pyinstaller
      - name: Generate the same SR850 FIR used by the VST3
        run: python tools/make_ir.py SystemAudio/SR850-Reference-48000.wav
      - name: Validate audio asset
        shell: pwsh
        run: |
          if (!(Test-Path SystemAudio/SR850-Reference-48000.wav)) { throw "Missing FIR" }
      - name: Build Windows executable
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name "SR850-System-Reference" --add-data "SystemAudio/SR850-Reference-48000.wav;." SystemAudio/sr850_system.py
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item dist/SR850-System-Reference.exe release/
          Copy-Item SystemAudio/README.md release/LEIA-ME.txt
          Compress-Archive -Path release/* -DestinationPath SR850-System-Reference-Windows.zip -Force
      - name: Download official Equalizer APO 1.4.2
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path vendor | Out-Null
          $uri = 'https://downloads.sourceforge.net/project/equalizerapo/1.4.2/EqualizerAPO-x64-1.4.2.exe'
          Invoke-WebRequest -Uri $uri -OutFile vendor/EqualizerAPO-x64-1.4.2.exe -MaximumRedirection 10
          if ((Get-Item vendor/EqualizerAPO-x64-1.4.2.exe).Length -lt 5000000) { throw 'Invalid Equalizer APO download' }
          Get-FileHash vendor/EqualizerAPO-x64-1.4.2.exe -Algorithm SHA256
      - name: Build one-click Windows installer
        shell: pwsh
        run: |
          choco install nsis --no-progress -y
          & 'C:\Program Files (x86)\NSIS\makensis.exe' SystemAudio/installer.nsi
          if (!(Test-Path SR850-System-Reference-Setup.exe)) { throw 'Installer not built' }
      - uses: actions/upload-artifact@v4
        with:
          name: SR850-System-Reference-Windows
          path: |\n            SR850-System-Reference-Windows.zip\n            SR850-System-Reference-Setup.exe
          if-no-files-found: error
