name: Build SR850 System Reference Windows EXE
on:
  push:
    branches: [feature/sr850-system-audio]
  workflow_dispatch:
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build dependencies
        run: python -m pip install numpy scipy pyinstaller
      - name: Generate the same SR850 FIR used by the VST3
        run: python tools/make_ir.py SystemAudio/SR850-Reference-48000.wav
      - name: Validate audio asset
        shell: pwsh
        run: |
          if (!(Test-Path SystemAudio/SR850-Reference-48000.wav)) { throw "Missing FIR" }
      - name: Build Windows executable
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name "SR850-System-Reference" --add-data "SystemAudio/SR850-Reference-48000.wav;." SystemAudio/sr850_system.py
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item dist/SR850-System-Reference.exe release/
          Copy-Item SystemAudio/README.md release/LEIA-ME.txt
          Compress-Archive -Path release/* -DestinationPath SR850-System-Reference-Windows.zip -Force
      - name: Download official Equalizer APO 1.4.2
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path vendor | Out-Null
          $expected = '7403be7427bbe1936a40dded082829b6e217fc4f5990fee5cba501f0ae055afa'
          $mirrors = @(
            'https://netix.dl.sourceforge.net/project/equalizerapo/1.4.2/EqualizerAPO-x64-1.4.2.exe',
            'https://pilotfiber.dl.sourceforge.net/project/equalizerapo/1.4.2/EqualizerAPO-x64-1.4.2.exe',
            'https://sourceforge.net/projects/equalizerapo/files/1.4.2/EqualizerAPO-x64-1.4.2.exe/download'
          )
          $valid = $false
          foreach ($uri in $mirrors) {
            try {
              curl.exe -fL --retry 3 --max-time 90 -A 'Mozilla/5.0' -o vendor/EqualizerAPO-x64-1.4.2.exe $uri
              if ($LASTEXITCODE -ne 0) { continue }
              $hash = (Get-FileHash vendor/EqualizerAPO-x64-1.4.2.exe -Algorithm SHA256).Hash.ToLowerInvariant()
              if ($hash -eq $expected) { $valid = $true; break }
              Write-Warning "Download did not match the official SHA256"
            } catch { Write-Warning $_ }
          }
          if (!$valid) { throw 'Could not download and authenticate Equalizer APO from official SourceForge mirrors' }
      - name: Build one-click Windows installer
        shell: pwsh
        run: |
          choco install nsis --no-progress -y
          & 'C:\Program Files (x86)\NSIS\makensis.exe' SystemAudio/installer.nsi
          if (!(Test-Path SR850-System-Reference-Setup.exe)) { throw 'Installer not built' }
      - uses: actions/upload-artifact@v4
        with:
          name: SR850-System-Reference-Windows
          path: |
            SR850-System-Reference-Windows.zip
            SR850-System-Reference-Setup.exe
          if-no-files-found: error
