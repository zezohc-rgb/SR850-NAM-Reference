name: Build SR850 System Reference Windows EXE
on:
  push:
    branches: [feature/sr850-system-audio]
  workflow_dispatch:
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build dependencies
        run: python -m pip install numpy scipy PySide6 pyinstaller soundcard cffi
      - name: Generate the same SR850 FIR used by the VST3
        run: |
          python tools/make_ir.py SystemAudio/SR850-Reference-48000.wav 48000
          python tools/make_ir.py SystemAudio/SR850-Reference-44100.wav 44100
      - name: Validate audio asset
        shell: pwsh
        run: |
          foreach ($sr in @("44100","48000")) {
            if (!(Test-Path "SystemAudio/SR850-Reference-$sr.wav")) { throw "Missing $sr FIR" }
          }
      - name: Smoke test Qt interface and actual FIR data
        run: python SystemAudio/test_qt_smoke.py
      - name: Check approved photographic artwork
        shell: pwsh
        run: |
          if (!(Test-Path "SystemAudio/SR850-visual-reference.png")) {
            throw "Approved SR850 visual artwork is missing. Add SystemAudio/SR850-visual-reference.png before building."
          }
      - name: Build Windows executable
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --uac-admin --name "SR850-System-Reference" --add-data "SystemAudio/SR850-Reference-48000.wav;." --add-data "SystemAudio/SR850-Reference-44100.wav;." --add-data "SystemAudio/SR850-visual-reference.png;." --hidden-import sr850_system --hidden-import spectrum_monitor --collect-all soundcard --collect-all cffi SystemAudio/sr850_qt.py
      - name: Build one-click Windows installer
        shell: pwsh
        run: |
          choco install nsis --no-progress -y
          & 'C:\Program Files (x86)\NSIS\makensis.exe' /NOCD SystemAudio/installer.nsi
          if (!(Test-Path SR850-System-Reference-Setup.exe)) { throw 'Installer not built' }
      - uses: actions/upload-artifact@v4
        with:
          name: SR850-System-Reference-Setup
          path: SR850-System-Reference-Setup.exe
          if-no-files-found: error
